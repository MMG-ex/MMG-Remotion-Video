name: Kaggle Offline Video Probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/offline-probe-trigger"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_SLUG: son-yaprak-offline-probe

    steps:
      - uses: actions/checkout@v4

      - name: Normalize Kaggle token
        shell: bash
        run: |
          set -euo pipefail
          CLEAN_TOKEN="$(printf '%s' "$KAGGLE_API_TOKEN" | tr -d '[:space:]')"
          echo "::add-mask::$CLEAN_TOKEN"
          echo "KAGGLE_API_TOKEN=$CLEAN_TOKEN" >> "$GITHUB_ENV"

      - name: Install Kaggle CLI
        run: python -m pip install -q -U kaggle

      - name: Detect Kaggle username
        shell: bash
        run: |
          set -euo pipefail
          USERNAME="$(python - <<'PY'
          import os, kaggle
          api = kaggle.api
          username = str((getattr(api, "config_values", {}) or {}).get("username", "") or "").strip()
          if not username:
              username = str(api._introspect_token(os.environ["KAGGLE_API_TOKEN"]) or "").strip()
          if not username:
              raise SystemExit(2)
          print(username)
          PY
          )"
          echo "KAGGLE_USERNAME=$USERNAME" >> "$GITHUB_ENV"

      - name: Build offline probe
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/kprobe
          mkdir -p /tmp/kprobe

          cat > /tmp/kprobe/probe.py <<'PY'
          import os, sys, json, glob
          print("PYTHON", sys.version)
          import torch
          print("TORCH", torch.__version__)
          print("CUDA_AVAILABLE", torch.cuda.is_available())
          if torch.cuda.is_available():
              print("GPU", torch.cuda.get_device_name(0))
              print("VRAM_GB", round(torch.cuda.get_device_properties(0).total_memory / 1024**3, 2))

          try:
              import diffusers
              print("DIFFUSERS", diffusers.__version__)
              from diffusers import WanPipeline
              print("WAN_PIPELINE_IMPORT", "OK")
          except Exception as e:
              print("WAN_PIPELINE_IMPORT", "FAIL", repr(e))

          try:
              import transformers
              print("TRANSFORMERS", transformers.__version__)
          except Exception as e:
              print("TRANSFORMERS_FAIL", repr(e))

          roots = []
          for root, dirs, files in os.walk("/kaggle/input"):
              depth = root.count(os.sep) - "/kaggle/input".count(os.sep)
              if depth <= 4:
                  roots.append((root, len(files)))
          print("INPUT_TREE", json.dumps(roots[:250], ensure_ascii=False))

          candidates = [p for p in glob.glob("/kaggle/input/**/*", recursive=True)
                        if os.path.isdir(p) and ("wan2" in p.lower() or "wan" in os.path.basename(p).lower())]
          print("WAN_CANDIDATES", json.dumps(candidates[:100], ensure_ascii=False))
          print("PROBE_DONE")
          PY

          cat > /tmp/kprobe/kernel-metadata.json <<JSON
          {
            "id": "${KAGGLE_USERNAME}/${KERNEL_SLUG}",
            "title": "Son Yaprak Offline Video Probe",
            "code_file": "probe.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": false,
            "machine_shape": "NvidiaTeslaT4",
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": ["pengcanlyu/wan2.1-t2v-1.3b/PyTorch/wan/1"]
          }
          JSON

      - name: Push offline GPU probe
        run: kaggle kernels push -p /tmp/kprobe --accelerator NvidiaTeslaT4

      - name: Print probe URL
        run: echo "https://www.kaggle.com/code/${KAGGLE_USERNAME}/${KERNEL_SLUG}"
