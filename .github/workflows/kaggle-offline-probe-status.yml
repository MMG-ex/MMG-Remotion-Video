name: Kaggle Offline Probe Status

on:
  push:
    branches:
      - main
    paths:
      - ".github/offline-probe-status-trigger"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_SLUG: son-yaprak-offline-video-probe
    steps:
      - uses: actions/checkout@v4
      - name: Normalize token
        shell: bash
        run: |
          set -euo pipefail
          CLEAN_TOKEN="$(printf '%s' "$KAGGLE_API_TOKEN" | tr -d '[:space:]')"
          echo "::add-mask::$CLEAN_TOKEN"
          echo "KAGGLE_API_TOKEN=$CLEAN_TOKEN" >> "$GITHUB_ENV"
      - name: Install Kaggle CLI
        run: python -m pip install -q -U kaggle
      - name: Detect username
        shell: bash
        run: |
          set -euo pipefail
          USERNAME="$(python - <<'PY'
          import os, kaggle
          api=kaggle.api
          u=str((getattr(api,"config_values",{}) or {}).get("username","") or "").strip()
          if not u:
              u=str(api._introspect_token(os.environ["KAGGLE_API_TOKEN"]) or "").strip()
          if not u: raise SystemExit(2)
          print(u)
          PY
          )"
          echo "KAGGLE_USERNAME=$USERNAME" >> "$GITHUB_ENV"
      - name: Show Kaggle status
        shell: bash
        run: |
          set -euo pipefail
          kaggle kernels status "${KAGGLE_USERNAME}/${KERNEL_SLUG}"
      - name: Show Kaggle logs
        shell: bash
        run: |
          set -o pipefail
          kaggle kernels logs "${KAGGLE_USERNAME}/${KERNEL_SLUG}" || true
