name: Kaggle GPU Alias Probe

on:
  push:
    branches: [main]
    paths: [".github/gpu-alias-probe-trigger"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_SLUG: son-yaprak-gpu-alias-probe
    steps:
      - uses: actions/checkout@v4
      - name: Normalize token
        shell: bash
        run: |
          set -euo pipefail
          CLEAN_TOKEN="$(printf '%s' "$KAGGLE_API_TOKEN" | tr -d '[:space:]')"
          echo "::add-mask::$CLEAN_TOKEN"
          echo "KAGGLE_API_TOKEN=$CLEAN_TOKEN" >> "$GITHUB_ENV"
      - name: Install Kaggle CLI
        run: python -m pip install -q -U kaggle
      - name: Detect username
        shell: bash
        run: |
          set -euo pipefail
          USERNAME="$(python - <<'PY'
          import os, kaggle
          api=kaggle.api
          u=str((getattr(api,"config_values",{}) or {}).get("username","") or "").strip()
          if not u:
              u=str(api._introspect_token(os.environ["KAGGLE_API_TOKEN"]) or "").strip()
          if not u: raise SystemExit(2)
          print(u)
          PY
          )"
          echo "KAGGLE_USERNAME=$USERNAME" >> "$GITHUB_ENV"
      - name: Build probe
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/kgpu && mkdir -p /tmp/kgpu
          cat > /tmp/kgpu/probe.py <<'PY'
          import os, torch
          print("CUDA_AVAILABLE", torch.cuda.is_available())
          print("DEVICE_COUNT", torch.cuda.device_count())
          if torch.cuda.is_available():
              print("GPU0", torch.cuda.get_device_name(0))
              print("VRAM_GB", round(torch.cuda.get_device_properties(0).total_memory/1024**3,2))
          try:
              import diffusers
              from diffusers import WanPipeline
              print("WAN_PIPELINE_IMPORT OK", diffusers.__version__)
          except Exception as e:
              print("WAN_PIPELINE_IMPORT FAIL", repr(e))
          print("WAN_MODEL_EXISTS", os.path.exists("/kaggle/input/models/pengcanlyu/wan2.1-t2v-1.3b/pytorch/wan/1"))
          print("GPU_ALIAS_PROBE_DONE")
          PY
          cat > /tmp/kgpu/kernel-metadata.json <<JSON
          {
            "id": "${KAGGLE_USERNAME}/${KERNEL_SLUG}",
            "title": "Son Yaprak GPU Alias Probe",
            "code_file": "probe.py",
            "language": "python",
            "kernel_type": "script",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": false,
            "dataset_sources": [],
            "competition_sources": [],
            "kernel_sources": [],
            "model_sources": ["pengcanlyu/wan2.1-t2v-1.3b/PyTorch/wan/1"]
          }
          JSON
      - name: Push with generic GPU alias
        run: kaggle kernels push -p /tmp/kgpu --accelerator gpu
      - name: Show URL
        run: echo "https://www.kaggle.com/code/${KAGGLE_USERNAME}/${KERNEL_SLUG}"
