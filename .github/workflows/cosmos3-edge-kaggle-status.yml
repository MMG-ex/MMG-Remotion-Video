name: Cosmos3 Edge Kaggle Status

on:
  push:
    branches:
      - son-yaprak-cosmos3
    paths:
      - ".github/workflows/cosmos3-edge-kaggle-status.yml"
      - ".github/cosmos-edge-status-trigger"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_SLUG: son-yaprak-cosmos3-edge-smoke
    steps:
      - name: Inspect Kaggle kernel
        shell: bash
        run: |
          set -euo pipefail
          CLEAN_TOKEN="$(printf '%s' "$KAGGLE_API_TOKEN" | tr -d '[:space:]')"
          echo "::add-mask::$CLEAN_TOKEN"
          export KAGGLE_API_TOKEN="$CLEAN_TOKEN"
          python -m pip install -q -U kaggle
          USERNAME="$(python - <<'PY'
          import os,kaggle
          api=kaggle.api
          u=str((getattr(api,"config_values",{}) or {}).get("username","") or "").strip()
          if not u:
              u=str(api._introspect_token(os.environ["KAGGLE_API_TOKEN"]) or "").strip()
          if not u: raise SystemExit(2)
          print(u)
          PY
          )"
          KERNEL="${USERNAME}/${KERNEL_SLUG}"
          echo "KERNEL=$KERNEL"
          echo "=== STATUS ==="
          kaggle kernels status "$KERNEL" || true
          echo "=== LOG TAIL ==="
          kaggle kernels logs "$KERNEL" 2>&1 | tail -n 160 || true
