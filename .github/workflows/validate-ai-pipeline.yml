name: MMG AI Pipeline Validate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-ai-pipeline.yml"
      - "src/AIClip/**"
      - "src/data/ai-project.ts"
      - "src/Root.tsx"
      - "pipeline/**"
      - ".github/workflows/render-ai-final.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Python syntax
        run: |
          python -m py_compile pipeline/quality_gate.py pipeline/download_sources.py
      - name: JSON and scene integrity
        run: |
          python - <<'PY'
          import json
          plan=json.load(open("pipeline/ozluyorum/scene-plan.json",encoding="utf-8"))
          src=json.load(open("pipeline/ozluyorum/video-sources.json",encoding="utf-8"))
          assert len(plan["scenes"])==16, len(plan["scenes"])
          assert len(src["scenes"])==16, len(src["scenes"])
          ids=[s["id"] for s in plan["scenes"]]
          assert ids==[f"{i:02d}" for i in range(1,17)], ids
          assert len({s["file"] for s in plan["scenes"]})==16
          assert all(s["end"]>s["start"] for s in plan["scenes"])
          assert abs(plan["scenes"][-1]["end"]-184.045283)<0.001
          assert set(ids)=={s["id"] for s in src["scenes"]}
          assert all(s["provider"]=="higgsfield" for s in src["scenes"])
          print("AI pipeline structure OK")
          PY
