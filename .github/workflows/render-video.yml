name: MMG Remotion MP4 Render

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "assets/**"
      - "package.json"
      - "remotion.config.ts"
      - ".github/workflows/render-video.yml"

permissions:
  contents: read

concurrency:
  group: mmg-remotion-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render Ozluyorum MP4
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package.json

      - name: Paketleri kur
        run: npm install --no-audit --no-fund

      - name: FFmpeg araçlarını kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg curl

      - name: Sinematik görselleri hazırla
        run: |
          test -f assets/son-yaprak-assets.zip
          unzip -o assets/son-yaprak-assets.zip -d .
          test -s public/images/01-window.jpg
          test -s public/images/12-dawn.jpg

      - name: Özlüyorum ses dosyasını özgün adıyla indir
        run: |
          mkdir -p public/audio
          curl --fail --location --retry 4 --retry-delay 5 \
            "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/f81400d9be2b11bbe0576720c3c49e191f5caa85b418b2a54d089bc9745d2b3f.wav" \
            --output "public/audio/1 numara manus_ Özlüyorum (Üni).wav"
          test -s "public/audio/1 numara manus_ Özlüyorum (Üni).wav"
          ffprobe -v error -show_entries format=duration -of csv=p=0 "public/audio/1 numara manus_ Özlüyorum (Üni).wav"

      - name: Remotion videosunu render et
        run: |
          mkdir -p out
          npx remotion render src/index.ts Visualizer "out/Manus - Özlüyorum (Üni).mp4" --codec=h264 --audio-codec=aac --audio-bitrate=320k --crf=18 --overwrite

      - name: Çıktıyı doğrula
        id: validate
        continue-on-error: true
        run: |
          OUTPUT="out/Manus - Özlüyorum (Üni).mp4"
          test -s "$OUTPUT"
          VIDEO_CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$OUTPUT" | tr -d '\r\n')"
          AUDIO_CODEC="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$OUTPUT" | tr -d '\r\n')"
          DURATION="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$OUTPUT" | tr -d '\r\n')"
          FILE_SIZE="$(stat -c%s "$OUTPUT")"
          echo "video=$VIDEO_CODEC audio=$AUDIO_CODEC duration=$DURATION bytes=$FILE_SIZE"
          test "$VIDEO_CODEC" = "h264"
          test "$AUDIO_CODEC" = "aac"
          test "$FILE_SIZE" -gt 1000000
          python3 -c 'import sys; d=float(sys.argv[1]); assert 183.5 <= d <= 184.8, f"unexpected duration: {d}"' "$DURATION"

      - name: MP4 dosyasını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Manus-Ozluyorum-Uni
          path: "out/Manus - Özlüyorum (Üni).mp4"
          if-no-files-found: error
          retention-days: 7

      - name: Doğrulama sonucunu uygula
        if: always()
        run: |
          test "${{ steps.validate.outcome }}" = "success"
