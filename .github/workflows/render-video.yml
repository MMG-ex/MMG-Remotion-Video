name: MMG Remotion MP4 Render

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "assets/**"
      - "package.json"
      - "remotion.config.ts"
      - ".github/workflows/render-video.yml"

permissions:
  contents: read

concurrency:
  group: mmg-remotion-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render Ozluyorum HAREKETLI MP4
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package.json

      - name: Paketleri kur
        run: npm install --no-audit --no-fund

      - name: FFmpeg araçlarını kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg curl

      - name: Özlüyorum ses dosyasını özgün adıyla indir
        run: |
          mkdir -p public/audio
          curl --fail --location --retry 4 --retry-delay 5 --retry-all-errors \
            "https://cdn.openart.ai/openart-uploads/production/attachment-transfers/f81400d9be2b11bbe0576720c3c49e191f5caa85b418b2a54d089bc9745d2b3f.wav" \
            --output "public/audio/1 numara manus_ Özlüyorum (Üni).wav"
          test -s "public/audio/1 numara manus_ Özlüyorum (Üni).wav"
          ffprobe -v error -show_entries format=duration -of csv=p=0 "public/audio/1 numara manus_ Özlüyorum (Üni).wav"

      - name: Gerçek hareketli video sahnelerini indir ve 1080p hazırla
        run: |
          set -euo pipefail
          mkdir -p public/video /tmp/ozluyorum-video

          fetch_clip () {
            ID="$1"
            NAME="$2"
            FALLBACK="${3:-}"
            SRC="/tmp/ozluyorum-video/${NAME}-source.mp4"
            OUT="public/video/${NAME}.mp4"

            echo "=== Pexels video ${ID} -> ${NAME} ==="
            if ! curl --fail --location --retry 2 --retry-delay 3 --retry-all-errors \
              --connect-timeout 20 --max-time 300 \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/153 Safari/537.36" \
              -e "https://www.pexels.com/" \
              "https://www.pexels.com/download/video/${ID}/" \
              --output "${SRC}"
            then
              rm -f "${SRC}"
              if [ -n "${FALLBACK}" ] && [ -s "public/video/${FALLBACK}.mp4" ]; then
                echo "[WARN] ${ID} indirilemedi; hareketli yedek kullaniliyor: ${FALLBACK}"
                cp "public/video/${FALLBACK}.mp4" "${OUT}"
                return 0
              fi
              echo "[ERROR] ${ID} indirilemedi ve yedek yok."
              return 1
            fi

            test -s "${SRC}"
            ffprobe -v error -show_entries format=duration -of csv=p=0 "${SRC}"

            ffmpeg -hide_banner -loglevel error -y -i "${SRC}" \
              -vf "scale=1920:1080:force_original_aspect_ratio=increase,crop=1920:1080,fps=30" \
              -an -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p -movflags +faststart "${OUT}"

            test -s "${OUT}"
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of csv=p=0 "${OUT}"
            rm -f "${SRC}"
          }

          fetch_clip 35213341 "01-rain-window"
          fetch_clip 38684062 "02-campus-walk" "01-rain-window"
          fetch_clip 4872859  "03-notebook" "02-campus-walk"
          fetch_clip 8500475  "04-classroom" "03-notebook"
          fetch_clip 7971029  "05-campus-friends" "02-campus-walk"
          fetch_clip 6798784  "06-old-photos" "03-notebook"
          fetch_clip 31384926 "07-sunset-friends" "05-campus-friends"
          fetch_clip 6308503  "08-train-departure" "02-campus-walk"
          fetch_clip 7252614  "09-campus-leave" "05-campus-friends"

          echo "Hazirlanan gerçek hareketli video dosyalari:"
          ls -lh public/video

          COUNT="$(find public/video -maxdepth 1 -type f -name '*.mp4' | wc -l | tr -d ' ')"
          test "$COUNT" -eq 9

      - name: TypeScript kontrolü
        run: npx tsc --noEmit

      - name: Remotion hareketli klibi render et
        run: |
          mkdir -p out
          npx remotion render src/index.ts Visualizer "out/Manus - Özlüyorum (Üni) - HAREKETLI.mp4" \
            --codec=h264 --audio-codec=aac --audio-bitrate=320k --crf=18 --concurrency=2 --overwrite

      - name: Çıktıyı doğrula
        id: validate
        continue-on-error: true
        run: |
          set -euo pipefail
          OUTPUT="out/Manus - Özlüyorum (Üni) - HAREKETLI.mp4"
          test -s "$OUTPUT"

          VIDEO_CODEC="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of csv=p=0 "$OUTPUT" | tr -d '\r\n,')"
          AUDIO_CODEC="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$OUTPUT" | tr -d '\r\n,')"
          DURATION="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$OUTPUT" | tr -d '\r\n,')"
          WIDTH="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$OUTPUT" | tr -d '\r\n,')"
          HEIGHT="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$OUTPUT" | tr -d '\r\n,')"
          FILE_SIZE="$(stat -c%s "$OUTPUT")"

          echo "video=$VIDEO_CODEC audio=$AUDIO_CODEC duration=$DURATION size=${WIDTH}x${HEIGHT} bytes=$FILE_SIZE"

          test "$VIDEO_CODEC" = "h264"
          test "$AUDIO_CODEC" = "aac"
          test "$WIDTH" = "1920"
          test "$HEIGHT" = "1080"
          test "$FILE_SIZE" -gt 10000000
          python3 -c 'import sys; d=float(sys.argv[1]); assert 183.5 <= d <= 184.8, f"unexpected duration: {d}"' "$DURATION"

      - name: Hareketli MP4 dosyasını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Manus-Ozluyorum-Uni-HAREKETLI
          path: "out/Manus - Özlüyorum (Üni) - HAREKETLI.mp4"
          if-no-files-found: error
          retention-days: 7

      - name: Doğrulama sonucunu uygula
        if: always()
        run: |
          test "${{ steps.validate.outcome }}" = "success"
