name: MMG Remotion MP4 Render

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "package.json"
      - "remotion.config.ts"
      - ".github/workflows/render-video.yml"

permissions:
  contents: read

concurrency:
  group: mmg-remotion-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Render Visualizer MP4
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package.json

      - name: Paketleri kur
        run: npm install --no-audit --no-fund

      - name: Remotion videosunu render et
        run: |
          mkdir -p out
          npx remotion render src/index.ts Visualizer out/MMG-Remotion-Video.mp4 --codec=h264 --audio-codec=aac --overwrite

      - name: MP4 dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: MMG-Remotion-Video
          path: out/MMG-Remotion-Video.mp4
          if-no-files-found: error
          retention-days: 3
